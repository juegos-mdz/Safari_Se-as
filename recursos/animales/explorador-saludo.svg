<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 280" role="img" aria-labelledby="title desc">
<title id="title">Explorador saludando</title>
<desc id="desc">Pequeño explorador sonriente con sombrero de safari, binoculares, mochila y una mano levantada saludando.</desc>
<defs>
  <linearGradient id="piel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f8d3ac"/><stop offset="1" stop-color="#eab58a"/></linearGradient>
  <linearGradient id="camisa" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f8d577"/><stop offset="1" stop-color="#e2a940"/></linearGradient>
  <linearGradient id="sombrero" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e7b565"/><stop offset="1" stop-color="#c58a3c"/></linearGradient>
  <linearGradient id="mochila" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d9733a"/><stop offset="1" stop-color="#b9532a"/></linearGradient>
</defs>

<!-- sombra -->
<ellipse cx="120" cy="268" rx="62" ry="8" fill="#06220f" opacity=".3"/>

